<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#262019">
<title>えほんの いちらん</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe4;
    --panel:#fdfbf5;
    --ink:#2c261e;
    --deep:#262019;
    --cream:#f2ead8;
    --muted:#8d8371;
    --line:#e3dac4;
    --hair:#ece5d2;
    --accent:#a8552b;
    --gold:#b99149;
    --radius:14px;
    --serif:"Shippori Mincho","Yu Mincho","Hiragino Mincho ProN",serif;
    --en:"Cormorant Garamond",serif;
    --gothic:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 400px at 50% -100px, rgba(185,145,73,.06), transparent),
      var(--bg);
    color:var(--ink);
    font-family:var(--gothic);
    font-size:15.5px;line-height:1.8;
    padding-bottom:72px;
  }
  .wrap{max-width:840px;margin:0 auto;padding:0 20px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  a{color:inherit}

  header{
    background:
      radial-gradient(900px 300px at 50% 120%, rgba(185,145,73,.18), transparent),
      var(--deep);
    color:var(--cream);
    text-align:center;padding:52px 16px 46px;
  }
  .ovl{
    display:block;font-family:var(--en);font-size:14px;letter-spacing:.55em;
    text-indent:.55em;color:var(--gold);text-transform:uppercase;margin-bottom:14px;
  }
  header h1{
    margin:0;font-family:var(--serif);font-weight:600;
    font-size:38px;letter-spacing:.2em;text-indent:.2em;color:var(--cream);
  }
  .orn{
    display:flex;align-items:center;gap:14px;justify-content:center;
    margin:18px auto 12px;color:var(--gold);width:min(360px,70%);
  }
  .orn::before,.orn::after{content:"";flex:1;border-top:1px solid rgba(185,145,73,.45)}
  .orn span{font-size:9px}
  header p{margin:0;font-size:13px;color:rgba(242,234,216,.75);letter-spacing:.2em;text-indent:.2em}

  .back{
    text-align:center;margin:18px 0 0;font-size:13.5px;letter-spacing:.06em;
  }
  .back a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}
  .back a:hover{color:var(--ink);border-color:var(--ink)}

  .countbar{
    display:flex;align-items:baseline;gap:10px;justify-content:center;
    margin:26px 0 0;color:var(--muted);font-size:14px;letter-spacing:.06em;
  }
  .countbar b{
    font-family:var(--en);font-style:italic;font-weight:500;
    font-size:40px;color:var(--accent);line-height:1;
  }

  .gsec{margin-top:34px}
  .ghead{
    display:flex;align-items:baseline;gap:14px;
    border-bottom:3px double var(--line);padding-bottom:7px;margin-bottom:4px;
  }
  .ghead h2{
    margin:0;font-family:var(--serif);font-weight:600;
    font-size:21px;letter-spacing:.12em;
  }
  .ghead .gcount{
    margin-left:auto;font-family:var(--en);font-style:italic;
    font-size:15px;color:var(--muted);letter-spacing:.05em;
  }
  ul.books{list-style:none;margin:0;padding:0}
  ul.books li{
    display:flex;align-items:baseline;gap:10px;
    padding:9px 4px;border-bottom:1px solid var(--hair);
  }
  ul.books li:last-child{border-bottom:none}
  .bname{font-family:var(--serif);font-weight:600;font-size:16.5px;letter-spacing:.04em}
  .bnote{color:var(--muted);font-size:12.5px;margin-left:auto;text-align:right;flex-shrink:0;max-width:46%}
  .qmark{
    display:inline-block;font-size:11px;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:0 8px;margin-left:8px;
    letter-spacing:.05em;vertical-align:2px;white-space:nowrap;
  }

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(60,50,30,.04), 0 14px 40px -28px rgba(60,50,30,.4);
    padding:20px 24px;margin-top:40px;font-size:13.5px;color:var(--muted);
  }
  .panel b{color:var(--ink)}

  footer{
    text-align:center;margin-top:46px;color:var(--muted);
    font-size:12px;letter-spacing:.14em;
  }
  footer .fo{display:block;color:var(--gold);font-size:9px;margin-bottom:8px}

  /* ===== 印刷（A4縦・2段） ===== */
  @page{ size:A4 portrait; margin:12mm; }
  @media print{
    body{background:#fff;color:#000;font-size:9.5pt;line-height:1.4;padding:0}
    header,.back,.panel,footer{display:none !important}
    .wrap{max-width:none;padding:0;column-count:2;column-gap:9mm;column-rule:.6pt solid #ccc}
    .countbar{display:block;column-span:all;text-align:left;margin:0 0 6pt;
      border-bottom:2pt solid #333;padding-bottom:4pt;font-size:9pt;color:#555}
    .countbar b{font-size:16pt;color:#000;margin-right:4pt}
    .countbar::before{content:"えほんの いちらん　";font-family:var(--serif);font-size:15pt;font-weight:600;color:#000;letter-spacing:.15em}
    .gsec{margin:0 0 8pt;break-inside:avoid-column}
    .ghead{border-bottom:1.6pt double #666;padding-bottom:2pt;margin-bottom:2pt}
    .ghead h2{font-size:11.5pt}
    .ghead .gcount{font-size:8.5pt;color:#666}
    ul.books li{padding:2.2pt 0;border-bottom:.6pt dotted #bbb;break-inside:avoid}
    .bname{font-size:9.5pt}
    .bnote{font-size:7.5pt;color:#666}
    .qmark{font-size:7pt;border-color:#999;color:#555;padding:0 4pt}
  }
</style>
</head>
<body>

<header>
  <span class="ovl">Home Picture Books</span>
  <h1>えほんの いちらん</h1>
  <div class="orn"><span>◆</span></div>
  <p>おうちにある えほんと ずかん</p>
</header>

<div class="wrap">

  <p class="back"><a href="./">← おもちゃメニューへ もどる</a></p>

  <div class="countbar"><b id="total">0</b>さつ あります</div>

  <div id="list"></div>

  <section class="panel">
    <b>（？）マークについて</b><br>
    背表紙の写真から読みとった本です。（？）が付いているものは自信がないので、
    ちがっていたら教えてください。棚のおくに隠れていて載っていない本もあるはず——
    背表紙が見えるように写真を撮って送ってもらえれば、この一覧に追加します。
  </section>

</div>

<footer><span class="fo">◆</span>えほんの いちらん ｜ 最終更新 2026-08-15</footer>

const listEl = document.getElementById("list");
const cats = [...new Set(EHON.map(b=>b.cat))];
for(const cat of cats){
  const books = EHON.filter(b=>b.cat===cat);
  const sec = document.createElement("section");

document.getElementById("total").textContent = EHON.length;
</script>

</html>
