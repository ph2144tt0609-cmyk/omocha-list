<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff8a3d">
<title>おもちゃひょう</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧸</text></svg>">
<style>
  :root{
    --bg:#fff8ef;
    --card:#ffffff;
    --ink:#33302c;
    --sub:#7d756c;
    --line:#eadfd0;
    --accent:#ff8a3d;
    --accent2:#3fb6a8;
    --accent3:#5b8def;
    --shadow:0 3px 0 #e9dcc9;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN","Zen Maru Gothic","Rounded Mplus 1c",-apple-system,"Segoe UI","Meiryo",sans-serif;
    font-size:17px;line-height:1.7;
    padding-bottom:80px;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 14px}

  /* ===== ヘッダー ===== */
  header{
    background:linear-gradient(160deg,#ffb765,#ff8a3d);
    color:#fff;padding:22px 0 26px;text-align:center;
    border-bottom-left-radius:26px;border-bottom-right-radius:26px;
    box-shadow:0 4px 0 rgba(0,0,0,.06);
  }
  header h1{margin:0;font-size:30px;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.12)}
  header p{margin:6px 0 0;font-size:14px;opacity:.95}

  /* ===== パネル ===== */
  .panel{
    background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px;margin-top:16px;
  }
  .panel h2{
    margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:7px;
  }
  .panel h2 .badge{
    background:var(--accent);color:#fff;border-radius:999px;
    font-size:12px;padding:2px 9px;font-weight:normal;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    appearance:none;border:2px solid var(--line);background:#fffdf9;color:var(--ink);
    border-radius:999px;padding:9px 15px;font-size:16px;font-family:inherit;
    cursor:pointer;box-shadow:0 2px 0 #ece1d1;transition:.12s;
  }
  .chip:active{transform:translateY(2px);box-shadow:none}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 0 #d96a22;font-weight:bold}
  .chip.g[aria-pressed="true"]{background:var(--accent2);border-color:var(--accent2);box-shadow:0 2px 0 #2e8d82}
  .chip.n[aria-pressed="true"]{background:var(--accent3);border-color:var(--accent3);box-shadow:0 2px 0 #3f68be}
  .chip.a[aria-pressed="true"]{background:#b06fd4;border-color:#b06fd4;color:#fff;box-shadow:0 2px 0 #8b4fae;font-weight:bold}

  .row{margin-bottom:14px}
  .row:last-child{margin-bottom:0}
  .row .label{font-size:14px;color:var(--sub);margin-bottom:6px}

  /* ===== 結果ヘッダ ===== */
  .resultbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:22px 0 10px;flex-wrap:wrap;
  }
  .count{font-size:20px;font-weight:bold}
  .count b{color:var(--accent);font-size:26px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    appearance:none;border:none;border-radius:999px;padding:10px 16px;
    font-size:15px;font-family:inherit;cursor:pointer;color:#fff;background:var(--accent3);
    box-shadow:0 3px 0 #3f68be;transition:.12s;
  }
  .btn:active{transform:translateY(3px);box-shadow:none}
  .btn.green{background:var(--accent2);box-shadow:0 3px 0 #2e8d82}
  .btn.ghost{background:#fff;color:var(--sub);border:2px solid var(--line);box-shadow:0 3px 0 #ece1d1}

  /* ===== カード ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .toy{
    background:var(--card);border:2px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:13px 14px;position:relative;
    display:flex;flex-direction:column;gap:8px;
  }
  .toy .top{display:flex;align-items:flex-start;gap:10px}
  .toy .icon{font-size:32px;line-height:1}
  .toy .name{font-size:18px;font-weight:bold;line-height:1.35;word-break:auto-phrase}
  .toy .note{font-size:13px;color:var(--sub);line-height:1.5}
  .toy .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .tag{
    font-size:13px;border-radius:999px;padding:3px 10px;background:#fff3e6;color:#b6620f;border:1px solid #ffdcb8;
  }
  .tag.time{background:#fff3e6;color:#b6620f;border-color:#ffdcb8;font-weight:bold}
  .tag.ppl{background:#e9f2ff;color:#3a5ea8;border-color:#cfe0ff}
  .tag.gen{background:#e6f7f4;color:#2b7d72;border-color:#c6ece5}
  .tag.age{background:#f6ecfb;color:#7c3fa3;border-color:#e6d2f2}
  .toy .edit{
    position:absolute;top:8px;right:8px;background:none;border:none;font-size:16px;
    cursor:pointer;opacity:.35;padding:4px;
  }
  .toy .edit:hover{opacity:1}
  .toy.mine{border-style:dashed;border-color:#f3c88a}
  .empty{
    text-align:center;color:var(--sub);padding:34px 10px;background:var(--card);
    border:2px dashed var(--line);border-radius:var(--radius);
  }

  /* ===== くみあわせ ===== */
  #plan{margin-top:14px}
  .planbox{
    background:linear-gradient(160deg,#effbf8,#e3f5f1);
    border:2px solid #bfe6de;border-radius:var(--radius);padding:14px;
  }
  .planbox h3{margin:0 0 10px;font-size:17px;color:#2b7d72}
  .steps{display:flex;flex-direction:column;gap:8px}
  .step{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 12px;
    border:1px solid #cfeae4;
  }
  .step .no{
    background:var(--accent2);color:#fff;border-radius:50%;width:26px;height:26px;
    display:grid;place-items:center;font-size:14px;flex:none;
  }
  .step .nm{font-weight:bold;flex:1}
  .step .tm{font-size:14px;color:#2b7d72;white-space:nowrap}
  .plantotal{margin-top:10px;font-size:15px;color:#2b7d72;text-align:right}

  /* ===== ルーレット結果 ===== */
  #pick{margin-top:14px}
  .pickbox{
    background:linear-gradient(160deg,#fff0d9,#ffe3bd);border:2px solid #ffcf94;
    border-radius:var(--radius);padding:18px;text-align:center;
  }
  .pickbox .big{font-size:26px;font-weight:bold;margin:6px 0}
  .pickbox .ic{font-size:46px}

  /* ===== モーダル ===== */
  dialog{
    border:none;border-radius:22px;padding:0;width:min(460px,92vw);
    box-shadow:0 18px 50px rgba(0,0,0,.25);
  }
  dialog::backdrop{background:rgba(50,40,30,.45)}
  .dlg{padding:20px}
  .dlg h3{margin:0 0 14px;font-size:20px}
  label.f{display:block;margin-bottom:12px;font-size:14px;color:var(--sub)}
  label.f input,label.f select,label.f textarea{
    display:block;width:100%;margin-top:5px;padding:10px 12px;font-size:16px;
    border:2px solid var(--line);border-radius:12px;font-family:inherit;background:#fffdf9;color:var(--ink);
  }
  .dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .danger{background:#e2695c;box-shadow:0 3px 0 #b64c41}
  .hint{font-size:12px;color:var(--sub);margin-top:-6px;margin-bottom:12px}

  footer{text-align:center;color:var(--sub);font-size:12px;padding:26px 14px}
  @media (max-width:420px){
    body{font-size:16px}
    header h1{font-size:25px}
    .grid{grid-template-columns:1fr 1fr;gap:10px}
    .toy .name{font-size:15px}
    .toy .icon{font-size:26px}
    .tag{font-size:11px;padding:2px 8px}
  }
</style>
</head>
<body>

<header>
  <h1>🧸 おもちゃひょう</h1>
  <p>いま あそべる おもちゃが すぐ わかる</p>
</header>

<div class="wrap">

  <!-- しぼりこみ -->
  <section class="panel">
    <div class="row">
      <h2>⏰ どれくらい あそべる？</h2>
      <div class="chips" id="timeChips"></div>
    </div>
    <div class="row">
      <div class="label">🎂 だれが あそぶ？（としの めやす）</div>
      <div class="chips" id="ageChips"></div>
    </div>
    <div class="row">
      <div class="label">👦 なんにんで あそぶ？</div>
      <div class="chips" id="pplChips"></div>
    </div>
    <div class="row">
      <div class="label">🗂 ジャンル</div>
      <div class="chips" id="genChips"></div>
    </div>
  </section>

  <!-- けっか -->
  <div class="resultbar">
    <div class="count"><b id="cnt">0</b> こ あそべるよ！</div>
    <div class="actions">
      <button class="btn green" id="planBtn">🧩 じかんいっぱい あそぶ くみあわせ</button>
      <button class="btn" id="pickBtn">🎯 ルーレットで きめる</button>
    </div>
  </div>

  <div id="pick"></div>
  <div id="plan"></div>

  <div class="grid" id="grid"></div>
  <div id="emptyBox"></div>

  <!-- かんり -->
  <section class="panel" style="margin-top:26px">
    <h2>🛠 おうちのひとメニュー <span class="badge">おもちゃを ふやす・なおす</span></h2>
    <div class="actions">
      <button class="btn" id="addBtn">➕ おもちゃを ふやす</button>
      <button class="btn ghost" id="exportBtn">💾 データを かきだす</button>
      <button class="btn ghost" id="importBtn">📂 データを よみこむ</button>
      <button class="btn ghost" id="resetBtn">↩️ さいしょに もどす</button>
    </div>
    <p class="hint" style="margin-top:10px">
      ふやした おもちゃは この タブレット／パソコンの なかに ほぞんされます。<br>
      ほかの きかいでも 見せたいときは「データを かきだす」→ そのファイルを おくって「よみこむ」。
    </p>
  </section>

</div>

<footer>おもちゃひょう ／ さいしゅう こうしん 2026-08-14</footer>

<!-- ついか・へんしゅう モーダル -->
<dialog id="dlg">
  <form method="dialog" class="dlg" id="form">
    <h3 id="dlgTitle">おもちゃを ふやす</h3>
    <label class="f">なまえ
      <input name="name" required maxlength="40" placeholder="れい：UNO">
    </label>
    <label class="f">アイコン（絵文字）
      <input name="icon" maxlength="4" placeholder="🃏">
    </label>
    <label class="f">ジャンル
      <input name="genre" list="genreList" required placeholder="カードゲーム">
      <datalist id="genreList"></datalist>
    </label>
    <label class="f">あそぶ じかんの めやす（ふん）
      <input name="min" type="number" min="1" max="480" step="5" required placeholder="20">
    </label>
    <label class="f">にんずう（さいしょう〜さいだい）
      <input name="people" placeholder="2-6" pattern="\d+(-\d+)?" required>
    </label>
    <label class="f">としの めやす（この としから）
      <select name="ageFrom" id="ageFrom"></select>
    </label>
    <label class="f">としの めやす（この としまで）
      <select name="ageTo" id="ageTo"></select>
    </label>
    <label class="f">メモ（なくてもOK）
      <input name="note" maxlength="60" placeholder="れい：ぜんぶで 108まい">
    </label>
    <div class="btns">
      <button class="btn danger" value="delete" id="delBtn" type="submit" formnovalidate>けす</button>
      <button class="btn ghost" value="cancel" type="submit" formnovalidate>やめる</button>
      <button class="btn green" value="ok" type="submit">ほぞん する</button>
    </div>
  </form>
</dialog>

<input type="file" id="fileInput" accept="application/json" hidden>

/* ジャンルごとの みため */
const GENRE_ICON = {
  "カードゲーム":"🃏","ボードゲーム":"🎲","パズル":"🧩","ブロック・レゴ":"🧱","おえかき":"🖍️",
  "こうさく":"✂️","のりもの":"🚗","ごっこあそび":"🍳","がくしゅう":"🔤","ぬいぐるみ":"🧸","そとあそび":"⚽",
  "ゲームき":"🎮","おんがく":"🎹","その他":"📦"
};

/* =========================================================
   ほぞん（ブラウザの なかに ついか分を のこす）
   ========================================================= */
const KEY = "omocha-list-v1";
let extra = [];      // ついかした おもちゃ
let removed = [];    // けした もとデータの id

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const o = JSON.parse(raw); extra = o.extra||[]; removed = o.removed||[]; }
  }catch(e){ console.warn(e); }
}
function save(){
  localStorage.setItem(KEY, JSON.stringify({extra, removed}));
}
function allToys(){
  return SEED.filter(t=>!removed.includes(t.id)).concat(extra);
}

/* =========================================================
   しぼりこみの じょうたい
   ========================================================= */
const TIMES = [
  {v:10,  label:"10ぷん"},
  {v:15,  label:"15ふん"},
  {v:30,  label:"30ぷん"},
  {v:60,  label:"1じかん"},
  {v:120, label:"2じかん"},
  {v:9999,label:"じかん たっぷり"}
];
const PPLS = [
  {v:0,label:"きにしない"},{v:1,label:"ひとり"},{v:2,label:"2人"},
  {v:3,label:"3人"},{v:4,label:"4人"},{v:5,label:"5人いじょう"}
];
/* としの めやす（0がいちばん ちいさい） */
const LEVELS = [
  {chip:"👶 ちいさい子", short:"ちいさい子", full:"0〜3さい（ようちえんの まえ）"},
  {chip:"🧒 ようちえん",  short:"ようちえん", full:"ようちえん・ほいくえん"},
  {chip:"1️⃣ 小1・2年",   short:"小1・2年",  full:"小学校 ていがくねん"},
  {chip:"3️⃣ 小3・4年",   short:"小3・4年",  full:"小学校 ちゅうがくねん"},
  {chip:"5️⃣ 小5・6年",   short:"小5・6年",  full:"小学校 こうがくねん"},
  {chip:"🧑 大人",       short:"大人",     full:"大人"}
];
let state = { time:60, ppl:0, genre:"ぜんぶ", age:-1 };

function ageOf(t){ return Array.isArray(t.age) ? t.age : [1,5]; }
function fitTime(t){ return t.min <= state.time; }
function fitPpl(t){
  if(!state.ppl) return true;
  const [a,b] = t.people;
  return state.ppl>=a && state.ppl<=b;
}
function fitAge(t){
  if(state.age<0) return true;
  const [a,b] = ageOf(t);
  return state.age>=a && state.age<=b;
}
function fitGenre(t){ return state.genre==="ぜんぶ" || t.genre===state.genre; }
function filtered(){
  return allToys().filter(t=>fitTime(t)&&fitPpl(t)&&fitAge(t)&&fitGenre(t))
                  .sort((a,b)=>a.min-b.min || a.name.localeCompare(b.name,"ja"));
}

/* =========================================================
   えがく
   ========================================================= */
const $ = s=>document.querySelector(s);

function timeLabel(m){
  if(m>=60){
    const h = Math.floor(m/60), r = m%60;
    return r ? `${h}じかん${r}ふん` : `${h}じかん`;
  }
  return `${m}ふん`;
}
function pplLabel(p){
  const [a,b]=p;
  if(a===b) return a===1 ? "ひとりで" : `${a}人で`;
  return `${a}〜${b}人`;
}
function ageLabel(t){
  const [a,b] = ageOf(t);
  if(a===b) return LEVELS[a].short;
  if(a===2 && b===4) return "小学生";
  if(a===2 && b===5) return "小学生〜大人";
  if(a===1 && b===5) return "ようちえん〜大人";
  if(a===0 && b===5) return "だれでも";
  return `${LEVELS[a].short}〜${LEVELS[b].short}`;
}

function renderChips(){
  $("#timeChips").innerHTML = TIMES.map(t=>
    `<button class="chip" data-t="${t.v}" aria-pressed="${state.time===t.v}">${t.label}</button>`).join("");
  $("#pplChips").innerHTML = PPLS.map(p=>
    `<button class="chip n" data-p="${p.v}" aria-pressed="${state.ppl===p.v}">${p.label}</button>`).join("");

  $("#ageChips").innerHTML =
    `<button class="chip a" data-a="-1" aria-pressed="${state.age===-1}">🌈 だれでも</button>` +
    LEVELS.map((l,i)=>
      `<button class="chip a" data-a="${i}" aria-pressed="${state.age===i}" title="${l.full}">${l.chip}</button>`).join("");

  const order = Object.keys(GENRE_ICON);
  const found = [...new Set(allToys().map(t=>t.genre))]
    .sort((a,b)=>{
      const ia = order.indexOf(a), ib = order.indexOf(b);
      return (ia<0?99:ia) - (ib<0?99:ib);
    });
  const genres = ["ぜんぶ", ...found];
  $("#genChips").innerHTML = genres.map(g=>
    `<button class="chip g" data-g="${g}" aria-pressed="${state.genre===g}">${g==="ぜんぶ"?"🌈 ぜんぶ":(GENRE_ICON[g]||"📦")+" "+g}</button>`).join("");

  $("#genreList").innerHTML = [...new Set(allToys().map(t=>t.genre))]
    .map(g=>`<option value="${g}">`).join("");
}

function renderList(){
  const list = filtered();
  $("#cnt").textContent = list.length;
  $("#grid").innerHTML = list.map(t=>`
    <div class="toy ${t.mine?"mine":""}">
      <button class="edit" data-edit="${t.id}" title="なおす">✏️</button>
      <div class="top">
        <div class="icon">${t.icon||GENRE_ICON[t.genre]||"📦"}</div>
        <div class="name">${esc(t.name)}</div>
      </div>
      ${t.note?`<div class="note">${esc(t.note)}</div>`:""}
      <div class="tags">
        <span class="tag time">⏰ ${timeLabel(t.min)}</span>
        <span class="tag age">🎂 ${ageLabel(t)}</span>
        <span class="tag ppl">👦 ${pplLabel(t.people)}</span>
        <span class="tag gen">${GENRE_ICON[t.genre]||"📦"} ${esc(t.genre)}</span>
      </div>
    </div>`).join("");
  $("#emptyBox").innerHTML = list.length ? "" :
    `<div class="empty">🥲 その じょうけんで あそべる おもちゃは ないみたい。<br>じかんか にんずうを かえてみてね。</div>`;
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){ renderChips(); renderList(); }

/* =========================================================
   ルーレット と くみあわせ
   ========================================================= */
$("#pickBtn").onclick = ()=>{
  const list = filtered();
  $("#plan").innerHTML = "";
  if(!list.length){ $("#pick").innerHTML=""; return; }
  const box = document.createElement("div");
  box.className = "pickbox";
  $("#pick").innerHTML = "";
  $("#pick").appendChild(box);
  let n = 0;
  const spin = setInterval(()=>{
    const t = list[Math.floor(Math.random()*list.length)];
    box.innerHTML = `<div class="ic">${t.icon||"📦"}</div><div class="big">${esc(t.name)}</div>`;
    if(++n>12){
      clearInterval(spin);
      box.innerHTML = `<div style="font-size:14px;color:#a06318">きょうは これで あそぼう！</div>
        <div class="ic">${t.icon||"📦"}</div>
        <div class="big">${esc(t.name)}</div>
        <div style="font-size:15px;color:#a06318">⏰ ${timeLabel(t.min)} ／ 👦 ${pplLabel(t.people)}</div>`;
    }
  }, 70);
};

$("#planBtn").onclick = ()=>{
  $("#pick").innerHTML = "";
  const limit = state.time===9999 ? 120 : state.time;
  const pool = filtered().filter(t=>t.min<=limit);
  if(!pool.length){ $("#plan").innerHTML=""; return; }

  // のこり じかんに はいるものを ランダムに つみあげる
  const chosen = [];
  let rest = limit;
  const bag = pool.slice();
  while(bag.length){
    const cand = bag.filter(t=>t.min<=rest);
    if(!cand.length) break;
    const t = cand[Math.floor(Math.random()*cand.length)];
    chosen.push(t);
    rest -= t.min;
    bag.splice(bag.indexOf(t),1);
    if(chosen.length>=5) break;
  }
  const used = chosen.reduce((s,t)=>s+t.min,0);
  $("#plan").innerHTML = `
    <div class="planbox">
      <h3>🧩 ${timeLabel(limit)} あるなら、この じゅんばん！</h3>
      <div class="steps">
        ${chosen.map((t,i)=>`
          <div class="step">
            <div class="no">${i+1}</div>
            <div class="nm">${t.icon||"📦"} ${esc(t.name)}</div>
            <div class="tm">${timeLabel(t.min)}</div>
          </div>`).join("")}
      </div>
      <div class="plantotal">ぜんぶで ${timeLabel(used)}（のこり ${timeLabel(limit-used)}）</div>
      <div style="text-align:right;margin-top:8px">
        <button class="btn green" onclick="document.getElementById('planBtn').click()">🔁 べつの くみあわせ</button>
      </div>
    </div>`;
};

/* =========================================================
   そうさ
   ========================================================= */
document.addEventListener("click", e=>{
  const c = e.target.closest(".chip");
  if(c){
    if(c.dataset.t!==undefined) state.time = +c.dataset.t;
    if(c.dataset.p!==undefined) state.ppl  = +c.dataset.p;
    if(c.dataset.a!==undefined) state.age  = +c.dataset.a;
    if(c.dataset.g!==undefined) state.genre = c.dataset.g;
    $("#pick").innerHTML=""; $("#plan").innerHTML="";
    render();
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if(ed) openDialog(ed.dataset.edit);
});

/* ついか・へんしゅう */
let editingId = null;
function openDialog(id){
  editingId = id||null;
  const f = $("#form");
  const opts = LEVELS.map((l,i)=>`<option value="${i}">${l.full}</option>`).join("");
  $("#ageFrom").innerHTML = opts;
  $("#ageTo").innerHTML = opts;
  f.reset();
  const t = id ? allToys().find(x=>x.id===id) : null;
  $("#dlgTitle").textContent = t ? "おもちゃを なおす" : "おもちゃを ふやす";
  $("#delBtn").style.display = t ? "" : "none";
  if(t){
    f.name.value=t.name; f.icon.value=t.icon||""; f.genre.value=t.genre;
    f.min.value=t.min; f.people.value=t.people[0]===t.people[1]?t.people[0]:t.people.join("-");
    f.note.value=t.note||"";
    const [a,b]=ageOf(t); f.ageFrom.value=a; f.ageTo.value=b;
  }else{
    f.genre.value = state.genre==="ぜんぶ" ? "" : state.genre;
    f.ageFrom.value = state.age<0 ? 1 : state.age;
    f.ageTo.value = 5;
  }
  $("#dlg").showModal();
}
$("#addBtn").onclick = ()=>openDialog(null);

$("#form").addEventListener("submit", e=>{
  const v = e.submitter?.value;
  if(v==="cancel") return;
  if(v==="delete"){
    if(!confirm("この おもちゃを けしますか？")){ e.preventDefault(); return; }
    if(editingId.startsWith("u")) extra = extra.filter(t=>t.id!==editingId);
    else if(!removed.includes(editingId)) removed.push(editingId);
    save(); render(); return;
  }
  const f = e.target;
  const p = f.people.value.split("-").map(Number);
  const obj = {
    id: editingId || ("u"+Date.now()),
    name: f.name.value.trim(),
    icon: f.icon.value.trim(),
    genre: f.genre.value.trim(),
    min: +f.min.value,
    people: [p[0], p[1]??p[0]],
    age: [Math.min(+f.ageFrom.value,+f.ageTo.value), Math.max(+f.ageFrom.value,+f.ageTo.value)],
    note: f.note.value.trim(),
    mine: true
  };
  if(editingId && !editingId.startsWith("u")){
    if(!removed.includes(editingId)) removed.push(editingId);
    obj.id = "u"+Date.now();
  }
  const i = extra.findIndex(t=>t.id===obj.id);
  if(i>=0) extra[i]=obj; else extra.push(obj);
  save(); render();
});

/* かきだし・よみこみ */
$("#exportBtn").onclick = ()=>{
  const blob = new Blob([JSON.stringify({extra,removed},null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "おもちゃひょう_データ.json";
  a.click();
};
$("#importBtn").onclick = ()=>$("#fileInput").click();
$("#fileInput").onchange = e=>{
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      extra = o.extra||[]; removed = o.removed||[];
      save(); render(); alert("よみこみ できました！");
    }catch(err){ alert("よみこめませんでした…"); }
  };
  r.readAsText(file);
};
$("#resetBtn").onclick = ()=>{
  if(!confirm("ついかした ぶんを ぜんぶ けして、さいしょの じょうたいに もどしますか？")) return;
  extra=[]; removed=[]; save(); render();
};

/* しゅつりょく */
load(); render();
</script>
